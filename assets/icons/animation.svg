<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="3D animation">
  <!-- outline, traced outside the cube silhouette -->
  <rect x="6" y="1" width="4" height="1" fill="#2a2622"/>
  <rect x="4" y="2" width="2" height="1" fill="#2a2622"/>
  <rect x="10" y="2" width="2" height="1" fill="#2a2622"/>
  <rect x="2" y="3" width="2" height="1" fill="#2a2622"/>
  <rect x="12" y="3" width="2" height="1" fill="#2a2622"/>
  <rect x="1" y="4" width="1" height="6" fill="#2a2622"/>
  <rect x="14" y="4" width="1" height="6" fill="#2a2622"/>
  <rect x="2" y="10" width="2" height="1" fill="#2a2622"/>
  <rect x="12" y="10" width="2" height="1" fill="#2a2622"/>
  <rect x="4" y="11" width="2" height="1" fill="#2a2622"/>
  <rect x="10" y="11" width="2" height="1" fill="#2a2622"/>
  <rect x="6" y="12" width="4" height="1" fill="#2a2622"/>

  <!-- left face -->
  <rect x="2" y="5" width="2" height="5" fill="#12718f"/>
  <rect x="4" y="6" width="2" height="5" fill="#12718f"/>
  <rect x="6" y="7" width="2" height="5" fill="#12718f"/>
  <!-- right face -->
  <rect x="8" y="7" width="2" height="5" fill="#0b4258"/>
  <rect x="10" y="6" width="2" height="5" fill="#0b4258"/>
  <rect x="12" y="5" width="2" height="5" fill="#0b4258"/>
  <!-- top face -->
  <rect x="6" y="2" width="4" height="1" fill="#8fd8f2"/>
  <rect x="4" y="3" width="8" height="1" fill="#8fd8f2"/>
  <rect x="2" y="4" width="12" height="1" fill="#8fd8f2"/>
  <rect x="4" y="5" width="8" height="1" fill="#8fd8f2"/>
  <rect x="6" y="6" width="4" height="1" fill="#8fd8f2"/>
  <!-- centre edge, where the three faces meet -->
  <rect x="7" y="7" width="2" height="1" fill="#5cc7ee"/>
</svg>
