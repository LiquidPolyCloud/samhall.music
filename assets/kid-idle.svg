<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 18 28" shape-rendering="crispEdges" role="img" aria-label="Pixel art of a kid standing and breathing">
  <title>Sam's student — idle</title>
  <!--
    16-bit style, Mana Seed-ish construction but scaled to a child:
      · 9px head on a 26px figure (~1:3) — an adult base would be nearer 1:4
      · short torso and legs, shoulders no wider than the head
      · outlines are dark tints of the material they wrap, never flat black
      · 3-tone ramps, lit from the upper left
      · face is two eye pixels only; at 8px wide a mouth becomes a muzzle
    Ramps:
      skin  #f0bd93 / #cf9268 / #8f5c3c
      hair  #b0794a / #8a5a34 / #4a2e19
      shirt #ff8a5c / #f15a29 / #c53c0c / #8f2c07
      denim #12718f / #0b4258 / #072e3d
      shoes #fcf8e8 / #ddd3b6 / #8a8073
  -->
  <style>
    @keyframes kid-bob {
      0%,   57.9% { transform: translateY(0px); }
      58%, 100%   { transform: translateY(1px); }
    }
    .kid-upper { animation: kid-bob 1.7s steps(1, end) infinite; }

    @keyframes kid-eyes-open {
      0%, 92.9% { opacity: 1; } 93%, 96.4% { opacity: 0; } 96.5%, 100% { opacity: 1; }
    }
    @keyframes kid-eyes-shut {
      0%, 92.9% { opacity: 0; } 93%, 96.4% { opacity: 1; } 96.5%, 100% { opacity: 0; }
    }
    .kid-eyes-open { animation: kid-eyes-open 5.3s linear infinite; }
    .kid-eyes-shut { opacity: 0; animation: kid-eyes-shut 5.3s linear infinite; }

    @media (prefers-reduced-motion: reduce) {
      .kid-upper, .kid-eyes-open, .kid-eyes-shut { animation: none; }
      .kid-eyes-shut { opacity: 0; }
    }
  </style>

  <!-- ===== planted: hips, legs, shoes ===== -->
  <g>
    <rect x="5"  y="17" width="1" height="3" fill="#072e3d"/>
    <rect x="6"  y="17" width="5" height="3" fill="#12718f"/>
    <rect x="11" y="17" width="1" height="3" fill="#0b4258"/>
    <rect x="12" y="17" width="1" height="3" fill="#072e3d"/>

    <rect x="5"  y="20" width="1" height="5" fill="#072e3d"/>
    <rect x="6"  y="20" width="1" height="5" fill="#12718f"/>
    <rect x="7"  y="20" width="1" height="5" fill="#0b4258"/>
    <rect x="10" y="20" width="1" height="5" fill="#0b4258"/>
    <rect x="11" y="20" width="1" height="5" fill="#12718f"/>
    <rect x="12" y="20" width="1" height="5" fill="#072e3d"/>

    <rect x="4"  y="25" width="1" height="1" fill="#8a8073"/>
    <rect x="5"  y="25" width="2" height="1" fill="#fcf8e8"/>
    <rect x="7"  y="25" width="1" height="1" fill="#ddd3b6"/>
    <rect x="10" y="25" width="1" height="1" fill="#ddd3b6"/>
    <rect x="11" y="25" width="2" height="1" fill="#fcf8e8"/>
    <rect x="13" y="25" width="1" height="1" fill="#8a8073"/>
    <rect x="4"  y="26" width="4" height="1" fill="#8a8073"/>
    <rect x="10" y="26" width="4" height="1" fill="#8a8073"/>
  </g>

  <!-- ===== breathes: arms, torso, head ===== -->
  <g class="kid-upper">
    <!-- arms -->
    <rect x="3"  y="11" width="1" height="4" fill="#8f2c07"/>
    <rect x="4"  y="11" width="1" height="4" fill="#f15a29"/>
    <rect x="13" y="11" width="1" height="4" fill="#c53c0c"/>
    <rect x="14" y="11" width="1" height="4" fill="#8f2c07"/>
    <rect x="3"  y="15" width="1" height="2" fill="#8f5c3c"/>
    <rect x="4"  y="15" width="1" height="2" fill="#f0bd93"/>
    <rect x="13" y="15" width="1" height="2" fill="#cf9268"/>
    <rect x="14" y="15" width="1" height="2" fill="#8f5c3c"/>
    <rect x="3"  y="17" width="1" height="1" fill="#8f5c3c"/>
    <rect x="4"  y="17" width="1" height="1" fill="#cf9268"/>
    <rect x="13" y="17" width="1" height="1" fill="#cf9268"/>
    <rect x="14" y="17" width="1" height="1" fill="#8f5c3c"/>
    <rect x="3"  y="18" width="2" height="1" fill="#8f5c3c"/>
    <rect x="13" y="18" width="2" height="1" fill="#8f5c3c"/>

    <!-- sloped shoulders + neck -->
    <rect x="6"  y="10" width="2" height="1" fill="#8f2c07"/>
    <rect x="10" y="10" width="2" height="1" fill="#8f2c07"/>
    <rect x="8"  y="10" width="2" height="1" fill="#cf9268"/>

    <!-- torso -->
    <rect x="5"  y="11" width="1" height="6" fill="#8f2c07"/>
    <rect x="6"  y="11" width="5" height="6" fill="#f15a29"/>
    <rect x="11" y="11" width="1" height="6" fill="#c53c0c"/>
    <rect x="12" y="11" width="1" height="6" fill="#8f2c07"/>
    <rect x="6"  y="11" width="2" height="2" fill="#ff8a5c"/>
    <rect x="5"  y="16" width="8" height="1" fill="#8f2c07"/>

    <!-- hair -->
    <rect x="6"  y="1" width="6" height="1" fill="#4a2e19"/>
    <rect x="5"  y="2" width="1" height="4" fill="#4a2e19"/>
    <rect x="12" y="2" width="1" height="4" fill="#4a2e19"/>
    <rect x="6"  y="2" width="3" height="1" fill="#b0794a"/>
    <rect x="9"  y="2" width="3" height="1" fill="#8a5a34"/>
    <rect x="6"  y="3" width="2" height="1" fill="#b0794a"/>
    <rect x="8"  y="3" width="4" height="1" fill="#8a5a34"/>
    <rect x="6"  y="4" width="6" height="1" fill="#8a5a34"/>

    <!-- face -->
    <rect x="6"  y="5" width="6" height="3" fill="#f0bd93"/>
    <rect x="5"  y="6" width="1" height="2" fill="#8f5c3c"/>
    <rect x="12" y="6" width="1" height="2" fill="#8f5c3c"/>
    <rect x="6"  y="8" width="1" height="1" fill="#8f5c3c"/>
    <rect x="7"  y="8" width="4" height="1" fill="#f0bd93"/>
    <rect x="11" y="8" width="1" height="1" fill="#8f5c3c"/>
    <rect x="7"  y="9" width="1" height="1" fill="#8f5c3c"/>
    <rect x="8"  y="9" width="2" height="1" fill="#f0bd93"/>
    <rect x="10" y="9" width="1" height="1" fill="#8f5c3c"/>

    <!-- eyes -->
    <g class="kid-eyes-open">
      <rect x="7"  y="6" width="1" height="2" fill="#3a2a1f"/>
      <rect x="10" y="6" width="1" height="2" fill="#3a2a1f"/>
    </g>
    <g class="kid-eyes-shut">
      <rect x="7"  y="7" width="1" height="1" fill="#cf9268"/>
      <rect x="10" y="7" width="1" height="1" fill="#cf9268"/>
    </g>
  </g>
</svg>
